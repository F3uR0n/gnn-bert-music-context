dataset:
  audio_primary: "fma_small"
  audio_tracks: 2000
  text_primary: "google/MusicCaps" # Used for Task 4 Contrastive Alignment
  segment_sec: 5
  sr: 22050
model:
  gnn_hidden_dim: 64
  gnn_layers: 3
  bert_model: "distilbert-base-uncased"
  fusion_dim: 128
training:
  batch_size: 32
  epochs_gnn: 30
  epochs_fusion: 8
  epochs_contrastive: 10
  lr: 0.001